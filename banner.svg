<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Wilfred Vincent: brand, packaging and AI tools for Indian exporters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1410"/>
      <stop offset="0.55" stop-color="#10261c"/>
      <stop offset="1" stop-color="#1b1208"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b93b"/>
      <stop offset="1" stop-color="#e58e26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f6b93b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6b93b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- floating spice dots -->
  <g fill="#f6b93b">
    <circle cx="880" cy="70" r="5" opacity="0.8"><animate attributeName="cy" values="70;54;70" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="140" r="8" opacity="0.55"><animate attributeName="cy" values="140;122;140" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="85" r="4" opacity="0.9"><animate attributeName="cy" values="85;100;85" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="190" r="10" opacity="0.4"><animate attributeName="cy" values="190;172;190" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="235" r="6" opacity="0.6"><animate attributeName="cy" values="235;250;235" dur="5.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#3ecf8e">
    <circle cx="1000" cy="250" r="5" opacity="0.7"><animate attributeName="cy" values="250;236;250" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="170" r="4" opacity="0.6"><animate attributeName="cy" values="170;184;170" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="70" r="6" opacity="0.5"><animate attributeName="cy" values="70;56;70" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rotating ring -->
  <g transform="translate(1000 160)" fill="none" stroke="#f6b93b" stroke-opacity="0.35">
    <circle r="96" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
    <circle r="62" stroke-dasharray="2 8" stroke="#3ecf8e"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="70" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#9fb3a8">HELLO, I'M</text>
  <text x="68" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#gold)">Wilfred Vincent</text>
  <text x="70" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e8efe9">Brand &#183; Packaging &#183; AI tools for Indian exporters</text>
  <rect x="70" y="258" width="150" height="4" rx="2" fill="url(#gold)">
    <animate attributeName="width" values="40;220;40" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
